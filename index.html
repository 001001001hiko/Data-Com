  <style>
/* ==========================================================================
   Computer Networks & Data Communication — Interactive Study Platform
   Theme: professional CS / networking education. Light + dark mode.
   No external assets. Fully responsive.
   ========================================================================== */

:root {
  --bg: #f3f6fc;
  --surface: #ffffff;
  --surface-2: #edf2fa;
  --text: #182335;
  --muted: #5d6d88;
  --border: #dde5f3;
  --primary: #2563eb;
  --primary-600: #1d4ed8;
  --primary-soft: #dce8ff;
  --accent: #7c3aed;
  --accent-soft: #e9e1fd;
  --success: #15803d;
  --success-soft: #d9f2e2;
  --danger: #dc2626;
  --danger-soft: #fbe0e0;
  --warning: #b45309;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 10px 28px rgba(18, 38, 76, 0.09);
  --shadow-sm: 0 3px 10px rgba(18, 38, 76, 0.07);
  --header-h: 66px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

[data-theme="dark"] {
  --bg: #0c1220;
  --surface: #141c30;
  --surface-2: #1b2540;
  --text: #e9effc;
  --muted: #9dabcb;
  --border: #263350;
  --primary: #5f8dff;
  --primary-600: #4c77e8;
  --primary-soft: #1d2c58;
  --accent: #a78bfa;
  --accent-soft: #2a2352;
  --success: #4ade80;
  --success-soft: #0e3b26;
  --danger: #f87171;
  --danger-soft: #421a1a;
  --warning: #fbbf24;
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
  --shadow-sm: 0 3px 10px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
}

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 0.5em; }
p { margin: 0 0 1em; }
.muted { color: var(--muted); }

/* ---------------- Header ---------------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
.brand-icon {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow: var(--shadow-sm);
}
.brand-icon svg { width: 24px; height: 24px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 1.05rem; letter-spacing: 0.2px; }
.brand-text small { color: var(--muted); font-size: 0.72rem; }

.main-nav { display: flex; align-items: center; gap: 6px; }
.main-nav a {
  text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem;
  padding: 9px 14px; border-radius: 10px; transition: all 0.18s ease;
}
.main-nav a:hover { color: var(--text); background: var(--surface-2); }
.main-nav a.active { color: var(--primary); background: var(--primary-soft); }

.icon-btn {
  width: 40px; height: 40px; border-radius: 11px; cursor: pointer;
  display: grid; place-items: center; color: var(--muted);
  background: transparent; border: 1px solid var(--border);
  transition: all 0.18s ease;
}
.icon-btn:hover { color: var(--text); border-color: var(--primary); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-sun { display: block; }
[data-theme="dark"] .icon-moon { display: none; }

/* ---------------- Main / footer ---------------- */
#app { padding: 28px 20px 60px; min-height: calc(100vh - var(--header-h) - 90px); animation: fadeUp 0.35s ease; }
.site-footer { border-top: 1px solid var(--border); padding: 22px 0; color: var(--muted); font-size: 0.85rem; }
.site-footer p { margin: 0; }

/* ---------------- Hero (home) ---------------- */
.hero {
  text-align: center; padding: 44px 28px; margin-bottom: 30px;
  background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft));
  border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(600px 200px at 50% -60px, rgba(255,255,255,0.35), transparent 70%);
}
.hero h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); margin-bottom: 6px; }
.hero .subtitle { font-size: 1.15rem; font-weight: 600; color: var(--primary); margin-bottom: 10px; }
.hero .hero-desc { max-width: 640px; margin: 0 auto 18px; color: var(--muted); }
.hero-stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.stat-chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 7px 16px; font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-sm);
}

/* ---------------- Cards & grids ---------------- */
.chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 24px;
}
.chapter-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 24px;
  display: flex; flex-direction: column; gap: 10px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.chapter-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chapter-num {
  font-size: 0.75rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--primary); background: var(--primary-soft);
  padding: 5px 12px; border-radius: 999px;
}
.chapter-card h2 { font-size: 1.25rem; margin: 0; }
.chapter-card > p { color: var(--muted); font-size: 0.93rem; margin: 0; flex: 1; }

/* ---------------- Buttons & badges ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  padding: 12px 22px; border-radius: 12px; border: 1px solid transparent;
  text-decoration: none; transition: all 0.18s ease; line-height: 1.3;
}
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover:not(:disabled) { background: var(--primary-600); transform: translateY(-1px); }
.btn-ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.btn-ghost:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.btn-danger:hover { filter: brightness(0.96); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-block { width: 100%; }

.badge {
  display: inline-block; font-size: 0.72rem; font-weight: 800; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--accent); background: var(--accent-soft);
  padding: 5px 12px; border-radius: 999px; margin-bottom: 10px;
}
.status-pill { font-size: 0.75rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.status-pill.done { color: var(--success); background: var(--success-soft); }
.status-pill.todo { color: var(--muted); background: var(--surface-2); }

/* ---------------- Progress bars ---------------- */
.progress { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
.progress .bar {
  flex: 1; height: 10px; border-radius: 999px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--border);
}
.progress .bar > span {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.5s ease;
}
.progress-label { font-size: 0.82rem; font-weight: 700; color: var(--muted); white-space: nowrap; }

/* ---------------- Breadcrumbs ---------------- */
.crumbs { font-size: 0.85rem; color: var(--muted); margin-bottom: 18px; }
.crumbs a { color: var(--primary); text-decoration: none; font-weight: 600; }
.crumbs a:hover { text-decoration: underline; }

/* ---------------- Chapter page ---------------- */
.chapter-head {
  display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 26px; margin-bottom: 22px;
}
.chapter-head h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: 6px; }
.chapter-progress { min-width: 260px; flex: 1; max-width: 380px; }
.chapter-progress .big { font-size: 1.6rem; font-weight: 800; }
.chapter-stats-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }
.chapter-stats-row div { font-size: 0.85rem; color: var(--muted); }
.chapter-stats-row strong { color: var(--text); }

.chapter-layout { display: flex; gap: 22px; align-items: flex-start; }

/* Sidebar */
.sidebar {
  flex: 0 0 300px; max-width: 300px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 14px;
  position: sticky; top: calc(var(--header-h) + 16px);
  max-height: calc(100vh - var(--header-h) - 32px); overflow-y: auto;
}
.sidebar h3 { font-size: 0.95rem; margin: 4px 6px 12px; }
.side-item {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
  padding: 9px 10px; border-radius: 10px; font-size: 0.88rem;
  transition: background 0.15s ease; border: 1px solid transparent;
}
.side-item:hover { background: var(--surface-2); }
.side-item.current { background: var(--primary-soft); border-color: var(--primary); font-weight: 700; }
.side-ico { width: 22px; height: 22px; flex: 0 0 auto; display: grid; place-items: center; }
.side-ico svg { width: 19px; height: 19px; }
.side-ico.done { color: var(--success); }
.side-ico.todo { color: var(--muted); }
.side-num { font-weight: 700; white-space: nowrap; color: var(--muted); font-size: 0.78rem; min-width: 52px; }
.side-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-score { font-size: 0.72rem; font-weight: 800; color: var(--success); white-space: nowrap; }
.side-final { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 12px; }

/* Chapter main */
.chapter-main { flex: 1; min-width: 0; }
.search-row { margin-bottom: 16px; position: relative; }
.search-row input {
  width: 100%; font-family: inherit; font-size: 0.95rem; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 13px 16px 13px 44px; box-shadow: var(--shadow-sm); outline: none;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.search-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search-row .search-ico {
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; color: var(--muted); pointer-events: none;
}
.slide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.slide-card {
  display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow-sm);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.slide-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--primary); }
.slide-card .slide-num { font-size: 0.72rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--primary); }
.slide-card .slide-title { font-weight: 700; font-size: 0.95rem; line-height: 1.4; }
.slide-card .slide-meta { margin-top: auto; }
.slide-card.final-card { background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft)); border-width: 2px; }
.slide-card.final-card .slide-num { color: var(--accent); }
.empty-note { color: var(--muted); padding: 30px; text-align: center; grid-column: 1 / -1; }

/* ---------------- Slide page ---------------- */
.slide-head {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 26px; margin-bottom: 20px;
}
.slide-head h1 { font-size: clamp(1.3rem, 3vw, 1.8rem); }
.slide-body { margin-bottom: 22px; }
.slide-body h2 { font-size: 1.12rem; color: var(--primary); margin-top: 1.4em; }
.slide-body h2:first-child { margin-top: 0; }
.key-points { margin: 0; padding-left: 1.2em; }
.key-points li { margin-bottom: 0.55em; }
.key-points li::marker { color: var(--primary); font-weight: 800; }
.example-list { margin: 0; padding-left: 1.2em; }
.example-list li {
  margin-bottom: 0.55em; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 14px; list-style: none; margin-left: -1.2em;
}
.example-tag {
  display: inline-block; font-size: 0.7rem; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--warning); margin-bottom: 4px;
}

/* ---------------- Quiz ---------------- */
.quiz { margin-bottom: 24px; }
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.quiz-head h2 { margin: 0; font-size: 1.25rem; }
.question {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 20px; margin-bottom: 16px;
  transition: border-color 0.2s ease;
}
.question.locked { opacity: 1; }
.q-text { font-weight: 700; margin-bottom: 14px; font-size: 1rem; }
.q-num { color: var(--primary); margin-right: 6px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; text-align: left;
  font-family: inherit; font-size: 0.94rem; color: var(--text); cursor: pointer;
  background: var(--surface-2); border: 2px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; transition: all 0.15s ease; width: 100%;
}
.opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
.opt .opt-letter {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; font-weight: 800; font-size: 0.85rem;
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
}
.opt.selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 3px var(--primary-soft); }
.opt.selected .opt-letter { background: var(--primary); border-color: var(--primary); color: #fff; }
.opt:disabled { cursor: default; }
.opt.is-correct { border-color: var(--success); background: var(--success-soft); }
.opt.is-correct .opt-letter { background: var(--success); border-color: var(--success); color: #fff; }
.opt.is-wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt.is-wrong .opt-letter { background: var(--danger); border-color: var(--danger); color: #fff; }
.opt.dim { opacity: 0.55; }
.q-feedback { margin-top: 12px; font-size: 0.9rem; font-weight: 700; }
.q-feedback.good { color: var(--success); }
.q-feedback.bad { color: var(--danger); }
.q-feedback .answer-key { font-weight: 600; color: var(--muted); }

.quiz-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.quiz-hint { font-size: 0.85rem; color: var(--muted); }

.quiz-result {
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px; margin-top: 20px; animation: fadeUp 0.35s ease;
}
.quiz-result h3 { margin-top: 0; font-size: 1.3rem; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 16px 0; }
.result-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
.result-stat .val { font-size: 1.5rem; font-weight: 800; }
.result-stat .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
.result-stat.good .val { color: var(--success); }
.result-stat.bad .val { color: var(--danger); }
.performance-note { font-size: 1rem; font-weight: 600; color: var(--primary); }

/* ---------------- Slide navigation ---------------- */
.slide-nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.slide-nav .spacer { flex: 1; }

/* ---------------- Progress dashboard ---------------- */
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.dash-card { text-align: center; }
.dash-card .big { font-size: 2rem; font-weight: 800; color: var(--primary); }
.dash-card .lbl { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
.chapter-row {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
  text-decoration: none; color: var(--text); transition: border-color 0.18s ease;
}
.chapter-row:hover { border-color: var(--primary); }
.chapter-row h3 { margin: 0; font-size: 1.05rem; }
.chapter-row .progress { margin: 8px 0 0; grid-column: 1 / -1; }
.chapter-row .row-score { font-weight: 800; font-size: 1.1rem; color: var(--primary); text-align: right; }
.danger-zone { margin-top: 26px; text-align: center; }

/* ---------------- Misc ---------------- */
.page-title { font-size: clamp(1.5rem, 3.5vw, 2.1rem); margin-bottom: 4px; }
.section-gap { margin-top: 30px; }
.notfound { text-align: center; padding: 60px 20px; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------------- Responsive ---------------- */
@media (max-width: 960px) {
  .chapter-layout { flex-direction: column; }
  .sidebar {
    flex: none; max-width: none; width: 100%;
    position: static; max-height: 320px;
  }
  .chapter-progress { max-width: none; }
}

@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  #app { padding: 20px 14px 48px; }
  .brand-text small { display: none; }
  .main-nav a { padding: 8px 10px; font-size: 0.88rem; }
  .hero { padding: 32px 18px; }
  .chapter-grid { grid-template-columns: 1fr; }
  .slide-grid { grid-template-columns: 1fr; }
  .chapter-head, .slide-head, .card { padding: 20px; }
  .slide-nav .btn { flex: 1; }
  .result-grid { grid-template-columns: repeat(2, 1fr); }
  .chapter-row { grid-template-columns: 1fr; }
  .chapter-row .row-score { text-align: left; }
}

  </style>
</head>

  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) { var d = JSON.parse(raw); if (d && d.chapters) return d; }
  } catch (e) {}
  return { chapters: {} };
}
var store = loadStore();
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
function chapterStore(n) {
  var k = String(n);
  if (!store.chapters[k]) store.chapters[k] = { slides: {}, final: null };
  return store.chapters[k];
}
function recordSlide(n, slideId, correctCount, totalCount) {
  var c = chapterStore(n);
  var attemptPct = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
  var prev = c.slides[slideId];
  var attempts = (prev ? prev.attempts : 0) + 1;
  var best = prev ? Math.max(prev.score, attemptPct) : attemptPct;
  c.slides[slideId] = { score: best, correct: correctCount, total: totalCount, attempts: attempts };
  saveStore();
  return attemptPct;
}
function recordFinal(n, correctCount, totalCount) {
  var c = chapterStore(n);
  var p = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
  var prev = c.final;
  var attempts = (prev ? prev.attempts : 0) + 1;
  var best = prev ? Math.max(prev.score, p) : p;
  c.final = { score: best, correct: correctCount, total: totalCount, attempts: attempts };
  saveStore();
  return p;
}
function resetProgress() {
  if (window.confirm('Reset all progress? This will delete every slide score, completion mark, and final quiz score. This cannot be undone.')) {
    store = { chapters: {} };
    saveStore();
    route();
  }
}

/* ---------------- Statistics ---------------- */
function chapterStats(n) {
  var ch = CHAPTERS[n];
  if (!ch) return null;
  var c = chapterStore(n);
  var total = ch.slides.length, done = 0, sum = 0;
  ch.slides.forEach(function (s) {
    var r = c.slides[s.id];
    if (r) { done++; sum += r.score; }
  });
  return {
    total: total,
    done: done,
    avg: done ? Math.round(sum / done) : null,
    final: c.final
  };
}
function totalSlidesAll() {
  return ORDER.reduce(function (acc, n) { return acc + CHAPTERS[n].slides.length; }, 0);
}
function overallStats() {
  var doneAll = 0, scores = [];
  ORDER.forEach(function (n) {
    var st = chapterStats(n), c = chapterStore(n);
    doneAll += st.done;
    CHAPTERS[n].slides.forEach(function (s) {
      var r = c.slides[s.id];
      if (r) scores.push(r.score);
    });
    if (c.final) scores.push(c.final.score);
  });
  var avg = scores.length ? Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length) : null;
  return { total: totalSlidesAll(), done: doneAll, avg: avg };
}

/* ---------------- Router ---------------- */
function safeScrollTop() {
  try { if (typeof window.scrollTo === 'function') window.scrollTo(0, 0); } catch (e) {}
}
function route() {
  var app = $('#app');
  var h = location.hash || '#/';
  var parts = h.replace(/^#\/?/, '').split('/');
  $all('.main-nav a').forEach(function (a) { a.classList.remove('active'); });

  if (parts[0] === '' || parts.length === 1 && parts[0] === '') {
    setNav('home'); renderHome(app); safeScrollTop(); return;
  }
  if (parts[0] === 'progress') {
    setNav('progress'); renderProgress(app); safeScrollTop(); return;
  }
  if (parts[0] === 'chapter') {
    var n = parseInt(parts[1], 10);
    if (!CHAPTERS[n]) { renderNotFound(app); safeScrollTop(); return; }
    setNav('home');
    if (parts[2] === 'slide') {
      var m = parseInt(parts[3], 10);
      if (!CHAPTERS[n].slides[m - 1]) { location.hash = '#/chapter/' + n; return; }
      renderSlide(app, n, m);
    } else if (parts[2] === 'final') {
      renderFinal(app, n);
    } else {
      renderChapter(app, n);
    }
    safeScrollTop(); return;
  }
  renderNotFound(app); safeScrollTop();
}
function setNav(name) {
  var a = $('.main-nav a[data-nav="' + name + '"]');
  if (a) a.classList.add('active');
}

/* ---------------- Shared fragments ---------------- */
function progressBar(done, total) {
  var p = total ? Math.round(done / total * 100) : 0;
  return '<div class="progress"><div class="bar" role="progressbar" aria-valuenow="' + p +
    '" aria-valuemin="0" aria-valuemax="100"><span style="width:' + p + '%"></span></div>' +
    '<span class="progress-label">' + done + ' / ' + total + '</span></div>';
}

function renderHome(app) {

/* ---------------- VIEW: Chapter ---------------- */
function slideMatches(s, q) {
  if (!q) return true;
  var hay = (s.title + ' ' + (s.questions || []).map(function (x) {
    return x.q + ' ' + (x.options || []).join(' ');
  }).join(' ')).toLowerCase();
  return hay.indexOf(q) !== -1;
}

function renderChapter(app, n) {
  var ch = CHAPTERS[n], st = chapterStats(n), c = chapterStore(n);
  var avgTxt = st.avg === null ? '—' : st.avg + '%';

  var head =
    '<nav class="crumbs"><a href="#/">Home</a> &nbsp;/&nbsp; Chapter ' + n + '</nav>' +
    '<section class="chapter-head">' +
      '<div>' +
        '<span class="badge">Study Mode</span>' +
        '<h1>Chapter ' + n + ' — ' + esc(ch.title) + '</h1>' +
        '<p class="muted" style="margin:0">' + st.total + ' slides &middot; quiz after every slide</p>' +
      '</div>' +
      '<div class="chapter-progress">' +
        '<div class="big">' + Math.round(st.done / Math.max(st.total, 1) * 100) + '%</div>' +
        progressBar(st.done, st.total) +
        '<div class="chapter-stats-row">' +
          '<div>Slides completed<br><strong>' + st.done + ' / ' + st.total + '</strong></div>' +
          '<div>Quiz average<br><strong>' + avgTxt + '</strong></div>' +
          '<div>Final quiz<br><strong>' + (st.final ? st.final.score + '%' : '—') + '</strong></div>' +
        '</div>' +
      '</div>' +
    '</section>';

  var layout =
    '<div class="chapter-layout">' +
      '<aside class="sidebar" aria-label="Slides in this chapter"><h3>Chapter ' + n + ' slides</h3>' +
        '<div id="sideList">' + sidebarListHTML(n, c, null, '') + '</div>' +
        '<div class="side-final"><a class="side-item" href="#/chapter/' + n + '/final">' +
          '<span class="side-ico ' + (st.final ? 'done' : 'todo') + '">' + (st.final ? IC.check : IC.flag) + '</span>' +
          '<span class="side-title"><strong>Chapter Final Quiz</strong></span>' +
          (st.final ? '<span class="side-score">' + st.final.score + '%</span>' : '') +
        '</a></div>' +
      '</aside>' +
      '<div class="chapter-main">' +
        '<div class="search-row">' + IC.search +
          '<input id="slideSearch" type="search" placeholder="Search in this chapter..." aria-label="Search in this chapter">' +
        '</div>' +
        '<div id="slideGrid" class="slide-grid">' + slideGridHTML(n, c, '') + '</div>' +
      '</div>' +
    '</div>';

  app.innerHTML = head + layout;

  var input = $('#slideSearch');
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();

    $('#sideList').innerHTML = sidebarListHTML(n, c, null, q);
  });
}

function sidebarListHTML(n, c, current, q) {
  var ch = CHAPTERS[n];
  var items = ch.slides.filter(function (s) { return slideMatches(s, q); });
  if (!items.length) return '<p class="empty-note" style="padding:16px">No slides match your search.</p>';
  return items.map(function (s) {
    var r = c.slides[s.id];
    var cls = 'side-item' + (current === s.number ? ' current' : '');
    var ico = r ? '<span class="side-ico done">' + IC.check + '</span>'
                : '<span class="side-ico todo">' + IC.circle + '</span>';
    var score = r ? '<span class="side-score">' + r.score + '%</span>' : '';
    return '<a class="' + cls + '" href="#/chapter/' + n + '/slide/' + s.number + '">' +
      ico + '<span class="side-num">Slide ' + s.number + '</span>' +
      '<span class="side-title">' + esc(s.title) + '</span>' + score + '</a>';
  }).join('');
}

function slideGridHTML(n, c, q) {
  var ch = CHAPTERS[n];
  var items = ch.slides.filter(function (s) { return slideMatches(s, q); });
  var cards = items.map(function (s) {
    var r = c.slides[s.id];
    var pill = r ? '<span class="status-pill done">✓ Completed · ' + r.score + '%</span>'
                 : '<span class="status-pill todo">○ Not completed</span>';
    return '<a class="slide-card" href="#/chapter/' + n + '/slide/' + s.number + '">' +
      '<span class="slide-num">Slide ' + s.number + '</span>' +
      '<span class="slide-title">' + esc(s.title) + '</span>' +
      '<span class="slide-meta">' + pill + '</span></a>';
  }).join('');
  var finalPill = c.final ? '<span class="status-pill done">✓ Completed · ' + c.final.score + '%</span>'
                          : '<span class="status-pill todo">○ Not completed</span>';
  var finalCard =
    '<a class="slide-card final-card" href="#/chapter/' + n + '/final">' +
      '<span class="slide-num">Final</span>' +
      '<span class="slide-title">Chapter Final Quiz</span>' +
      '<span class="slide-meta">' + finalPill + '</span></a>';
  if (!items.length && !q) return finalCard;
  if (!items.length) return '<p class="empty-note">No slides match your search.</p>' + finalCard;
  return cards + finalCard;
}

/* ---------------- VIEW: Slide (its own quiz) ---------------- */
function renderSlide(app, n, m) {
  var ch = CHAPTERS[n], s = ch.slides[m - 1], total = ch.slides.length;
  var c = chapterStore(n);
  var prev = c.slides[s.id];
  var hasQuiz = (s.questions || []).length > 0;

  var head =
    '<nav class="crumbs"><a href="#/">Home</a> &nbsp;/&nbsp; <a href="#/chapter/' + n + '">Chapter ' + n +
    '</a> &nbsp;/&nbsp; Slide ' + m + '</nav>' +
    '<section class="slide-head">' +
      '<span class="badge">Study Mode</span>' +

      '<p class="muted" style="margin:0 0 8px">Slide ' + m + ' of ' + total +
        (prev ? ' &nbsp;·&nbsp; Best score: <strong>' + prev.score + '%</strong>' : '') + '</p>' +
      progressBar(m, total) +

  var quizShell = hasQuiz

  var prevBtn = m > 1
    ? '<a class="btn btn-ghost" href="#/chapter/' + n + '/slide/' + (m - 1) + '">' + IC.arrowL + ' Previous Slide</a>' : '';

    ? '<a class="btn btn-ghost" href="#/chapter/' + n + '/slide/' + (m + 1) + '">Next Slide ' + IC.arrowR + '</a>' : '';

/* ---------------- VIEW: Chapter final quiz ---------------- */
function finalFeedback(p) {

  if (p >= 70) return 'Good job! You have a solid understanding of this chapter.';
  if (p >= 50) return 'Fair effort. Review the chapter slides and try again to improve your score.';
  return 'Keep studying this chapter, then try the final quiz again.';
}
function renderFinal(app, n) {

  });

/* ---------------- Quiz component ----------------
   Renders clickable option cards (A–D). Selection is changeable until the
   user submits. After submit the quiz locks, answers are checked, and a
   result panel with per-question feedback appears. Try Again resets only
   this quiz instance.                                                     */
function mountQuiz(container, cfg) {
  var questions = cfg.questions || [];
  var state = { answers: [], submitted: false };
  for (var i = 0; i < questions.length; i++) state.answers.push(null);

  function optionHTML(qi, oi, text) {
    return '<button type="button" class="opt" data-q="' + qi + '" data-o="' + oi + '" aria-pressed="false">' +
      '<span class="opt-letter">' + LETTERS[oi] + '</span><span>' + esc(text) + '</span></button>';
  }
  function quizHTML() {
    var html = questions.map(function (q, qi) {
      var opts = q.options.map(function (o, oi) { return optionHTML(qi, oi, o); }).join('');
      return '<div class="question" data-qi="' + qi + '">' +
        '<p class="q-text"><span class="q-num">Q' + (qi + 1) + '.</span>' + esc(q.q) + '</p>' +
        '<div class="opts">' + opts + '</div>' +
        '<div class="q-feedback" hidden></div></div>';
    }).join('');
    html += '<div class="quiz-actions">' +
      '<button type="button" class="btn btn-primary" id="quizSubmit" disabled>' + esc(cfg.submitLabel || 'Submit Answers') + '</button>' +
      '<span class="quiz-hint" id="quizHint">Select an answer for every question to submit.</span></div>' +
      '<div id="quizResult"></div>';
    return html;
  }

  container.innerHTML = quizHTML();

  function refreshSubmit() {
    var answered = state.answers.filter(function (a) { return a !== null; }).length;
    var btn = $('#quizSubmit', container);
    btn.disabled = answered < questions.length || state.submitted;
    $('#quizHint', container).textContent =
      answered < questions.length
        ? 'Answered ' + answered + ' of ' + questions.length + ' — select an answer for every question to submit.'
        : (state.submitted ? '' : 'Ready! Click "' + (cfg.submitLabel || 'Submit Answers') + '" to check your answers.');
  }

  $all('.opt', container).forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (state.submitted) return;
      var qi = parseInt(btn.getAttribute('data-q'), 10);
      var oi = parseInt(btn.getAttribute('data-o'), 10);
      state.answers[qi] = oi;
      $all('.opt[data-q="' + qi + '"]', container).forEach(function (b) {
        var on = parseInt(b.getAttribute('data-o'), 10) === oi;
        b.classList.toggle('selected', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      refreshSubmit();
    });
  });

  $('#quizSubmit', container).addEventListener('click', function () {
    if (state.submitted) return;
    state.submitted = true;

    var correctCount = 0;
    questions.forEach(function (q, qi) {
      var chosen = state.answers[qi];
      var ok = chosen === q.correct;
      if (ok) correctCount++;
      var box = $('.question[data-qi="' + qi + '"]', container);
      box.classList.add('locked');
      $all('.opt', box).forEach(function (b) {
        b.disabled = true;
        var oi = parseInt(b.getAttribute('data-o'), 10);
        b.classList.remove('selected');
        if (oi === q.correct) b.classList.add('is-correct');
        else if (oi === chosen && !ok) b.classList.add('is-wrong');
        else b.classList.add('dim');
      });
      var fb = $('.q-feedback', box);
      fb.hidden = false;
      if (ok) {
        fb.className = 'q-feedback good';
        fb.textContent = '\u2713 Correct';
      } else {
        fb.className = 'q-feedback bad';
        fb.innerHTML = '\u2717 Incorrect &nbsp;<span class="answer-key">Correct answer: ' +
          LETTERS[q.correct] + '</span>';
      }
    });

    var total = questions.length;
    var pctScore = total ? Math.round(correctCount / total * 100) : 0;
    var title = cfg.resultTitle || 'Quiz Completed!';
    var perf = cfg.feedbackFor ? '<p class="performance-note">' + esc(cfg.feedbackFor(pctScore)) + '</p>' : '';

    $('#quizResult', container).innerHTML =
      '<div class="quiz-result" role="status">' +
        '<h3>' + esc(title) + '</h3>' +
        '<div class="result-grid">' +
          '<div class="result-stat"><div class="val">' + correctCount + ' / ' + total + '</div><div class="lbl">Score</div></div>' +
          '<div class="result-stat"><div class="val">' + pctScore + '%</div><div class="lbl">Percentage</div></div>' +
          '<div class="result-stat good"><div class="val">' + correctCount + '</div><div class="lbl">Correct</div></div>' +
          '<div class="result-stat bad"><div class="val">' + (total - correctCount) + '</div><div class="lbl">Incorrect</div></div>' +
        '</div>' + perf +
        '<div class="quiz-actions"><button type="button" class="btn btn-ghost" id="quizRetry">Try Again</button></div>' +
      '</div>';

    $('#quizRetry', container).addEventListener('click', function () {
      mountQuiz(container, cfg); // reset only this quiz
    });

    if (cfg.onSubmit) cfg.onSubmit({ correct: correctCount, total: total, pct: pctScore });
    refreshSubmit();
  });

  refreshSubmit();
}

/* ---------------- VIEW: My Progress dashboard ---------------- */
function renderProgress(app) {
  var ov = overallStats();
  var overallPct = ov.total ? Math.round(ov.done / ov.total * 100) : 0;

  var scored = [];
  ORDER.forEach(function (n) {
    var st = chapterStats(n);
    if (st.avg !== null) scored.push({ n: n, avg: st.avg });
  });
  var best = scored.length ? scored.reduce(function (a, b) { return b.avg > a.avg ? b : a; }) : null;
  var worst = scored.length ? scored.reduce(function (a, b) { return b.avg < a.avg ? b : a; }) : null;

  var head =
    '<nav class="crumbs"><a href="#/">Home</a> &nbsp;/&nbsp; My Progress</nav>' +
    '<h1 class="page-title">My Progress</h1>' +
    '<p class="muted">Everything below is stored locally in this browser and survives a page refresh.</p>';

  var dash =
    '<div class="dash-grid section-gap">' +
      '<div class="card dash-card"><div class="big">' + overallPct + '%</div><div class="lbl">Overall Progress</div></div>' +
      '<div class="card dash-card"><div class="big">' + ov.done + ' / ' + ov.total + '</div><div class="lbl">Completed Slides</div></div>' +
      '<div class="card dash-card"><div class="big">' + (ov.avg === null ? '—' : ov.avg + '%') + '</div><div class="lbl">Average Quiz Score</div></div>' +
      '<div class="card dash-card"><div class="big">' + (best ? 'Ch ' + best.n : '—') + '</div><div class="lbl">Best Chapter' + (best ? ' · ' + best.avg + '%' : '') + '</div></div>' +
      '<div class="card dash-card"><div class="big">' + (worst ? 'Ch ' + worst.n : '—') + '</div><div class="lbl">Weakest Chapter' + (worst ? ' · ' + worst.avg + '%' : '') + '</div></div>' +
    '</div>';

  var rows = ORDER.map(function (n) {
    var ch = CHAPTERS[n], st = chapterStats(n);
    var avgTxt = st.avg === null ? 'No quizzes yet' : 'Quiz average: ' + st.avg + '%';
    var finalTxt = st.final ? ' · Final quiz: ' + st.final.score + '%' : '';
    return '<a class="chapter-row" href="#/chapter/' + n + '">' +
      '<div><h3>Chapter ' + n + ' — ' + esc(ch.title) + '</h3>' +
      '<div class="muted" style="font-size:0.85rem">' + esc(avgTxt) + esc(finalTxt) + '</div></div>' +
      '<div class="row-score">' + Math.round(st.done / Math.max(st.total, 1) * 100) + '%</div>' +
      progressBar(st.done, st.total) +
    '</a>';
  }).join('');

  var danger =
    '<div class="danger-zone"><button class="btn btn-danger" id="resetBtn">Reset Progress</button></div>';

  app.innerHTML = head + dash + '<h2 class="section-gap">Chapter Scores</h2>' + rows + danger;
  $('#resetBtn').addEventListener('click', resetProgress);
}

/* ---------------- Init ---------------- */
document.addEventListener('DOMContentLoaded', function () {
  initTheme();
  window.addEventListener('hashchange', route);
  if (!location.hash) location.hash = '#/';
  route();
